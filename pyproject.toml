[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_rag"]

[project]
name = "simple-rag"
version = "0.1.0"
description = "Foundation of a production agentic RAG system: a modular retrieval pipeline with isolated stages for ingestion, chunking, embedding, retrieval, and grounded generation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "embedded-postgres>=18.6.3",
    "openai>=3.58.0",
    "pdfplumber>=0.11.11",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
]
